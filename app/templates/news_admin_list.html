<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Tin tức</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h2>📰 Quản lý Tin tức</h2>
  <a href="/admin/news/new" class="btn btn-primary mb-3">➕ Đăng tin mới</a>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tiêu đề</th>
        <th>Tóm tắt</th>
        <th>Ngày tạo</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody>
      {% for n in news_list %}
      <tr>
        <td>{{ n.id }}</td>
        <td>{{ n.title }}</td>
        <td>{{ n.summary[:50] }}...</td>
        <td>{{ n.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
        <td>
          <a href="/admin/news/edit/{{ n.id }}" class="btn btn-sm btn-warning">✏ Sửa</a>
          <a href="/admin/news/delete/{{ n.id }}" class="btn btn-sm btn-danger"
             onclick="return confirm('Xóa bản tin này?')">🗑 Xóa</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/" class="btn btn-secondary">⬅ Quay lại</a>

</body>
</html>
