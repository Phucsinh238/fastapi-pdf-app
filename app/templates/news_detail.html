<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ news.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1 class="mb-3">{{ news.title }}</h1>
  <p class="text-muted">🕒 {{ news.created_at }}</p>

  {% if news.image_url %}
    <img src="/news/image/{{ news.image_url }}" 
         class="img-fluid rounded mb-4" 
         alt="{{ news.title }}">
  {% endif %}

  <div class="mt-3">
    {{ news.content | safe }}
  </div>



{% if news.link %}
  <div class="mt-4 p-3 border rounded bg-light">
    <h5>🔗 Liên kết đính kèm:</h5>
    <a href="{{ news.link }}" target="_blank" class="text-decoration-none">
      <div class="card mt-2 shadow-sm">
        <img src="https://image.thum.io/get/{{ news.link }}" class="card-img-top" alt="Preview">
        <div class="card-body">
          <p class="card-text text-truncate">{{ news.link }}</p>
        </div>
      </div>
    </a>
  </div>
{% endif %}

  
  <a href="/" class="btn btn-outline-primary mt-3">⬅ Back to Home</a>
</body>
</html>
