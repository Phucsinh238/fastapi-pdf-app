<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Đăng bản tin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h2>📰 Đăng bản tin mới</h2>
  <form action="/admin/news/new" method="post" enctype="multipart/form-data" class="mt-4">
    <div class="mb-3">
      <label class="form-label">Tiêu đề</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Tóm tắt (250 ký tự)</label>
      <textarea name="summary" class="form-control" maxlength="250" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Nội dung đầy đủ</label>
      <textarea name="content" class="form-control" rows="8" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Ảnh minh họa</label>
      <input type="file" name="image" class="form-control">
    </div>


    <div class="mb-3">
    <label class="form-label">🔗 Liên kết đính kèm (URL)</label>
    <input type="url" name="link" class="form-control" placeholder="https://example.com/article-or-video">
    </div>
    
    <button type="submit" class="btn btn-primary">📤 Đăng tin</button>
    <a href="/" class="btn btn-secondary">⬅ Quay lại</a>
  </form>

</body>
</html>
